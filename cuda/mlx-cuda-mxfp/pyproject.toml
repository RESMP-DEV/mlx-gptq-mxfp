[project]
name = "mlx-cuda-mxfp"
version = "0.1.0"
description = "Reproducible MLX-CUDA bootstrap and MXFP4/MXFP8 runtime probes"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "mlx-lm[cuda12]==0.31.3",
    "nvidia-cuda-runtime-cu12==12.9.79",
]

[project.urls]
Repository = "https://github.com/RESMP-DEV/mlx-cuda-mxfp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["probe_mxfp_cuda.py"]
