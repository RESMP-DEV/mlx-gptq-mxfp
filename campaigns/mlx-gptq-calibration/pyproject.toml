[project]
name = "mlx-gptq-calibration"
version = "0.1.0"
description = "Reproducible CUDA-to-MLX GPTQ calibration campaigns"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
mlx-gptq-calibration = "mlx_gptq_calibration:main"
mlx-gptq-logit-trace = "mlx_gptq_calibration.logit_trace:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
